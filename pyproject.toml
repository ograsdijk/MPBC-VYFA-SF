[project]
name = "mpbc-vyfa-sf"
version = "0.3.0"
description = "Python interface for a MPB VYFA amplifier"
authors = [{ name = "ograsdijk", email = "o.grasdijk@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.urls]
repository = "https://github.com/ograsdijk/MPBC-VYFA-SF"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires a real MPB amplifier on a serial port (set MPB_PORT)",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["examples"]

[build-system]
requires = ["uv_build>=0.11.20,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mpbc_vyfa_sf"
module-root = ""
